[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miro"
version = "0.1.0"
description = "Miro backend (FastAPI, Python 3.12)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/miro"]
